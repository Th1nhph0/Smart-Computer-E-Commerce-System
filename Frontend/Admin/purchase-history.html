<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default" data-assets-path="assets/">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch Sử Mua Hàng</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/vendor/css/theme-default.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/js/config.js"></script>
</head>
<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
                <div class="app-brand demo"><a href="index.html" class="app-brand-link"><span class="app-brand-text demo menu-text fw-bolder ms-2">BAKERY</span></a></div>
                <ul class="menu-inner py-1">
                    <li class="menu-item"><a href="index.html" class="menu-link"><i class="menu-icon tf-icons bx bx-home-circle"></i><div>Tổng Quan</div></a></li>
                    <li class="menu-header small text-uppercase"><span class="menu-header-text">Quản Lý Cửa Hàng</span></li>
                    <li class="menu-item">
                        <a href="list-customer.html" class="menu-link menu-toggle"><i class="menu-icon tf-icons bx bx-user-pin"></i><div>Khách hàng</div></a>
                        <ul class="menu-sub">
                            <li class="menu-item"><a href="list-customer.html" class="menu-link"><div>Danh sách Khách hàng</div></a></li>
                        </ul>
                    </li>
                </ul>
            </aside>

            <div class="layout-page">
                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0" id="historyTitle">Lịch Sử Mua Hàng</h5>
                                <a href="list-customer.html" class="btn btn-outline-secondary"><i class="bx bx-arrow-back me-1"></i>Quay lại</a>
                            </div>
                            <div class="table-responsive text-nowrap">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Mã Đơn</th>
                                            <th>Ngày Đặt Hàng</th>
                                            <th>Tổng Tiền</th>
                                            <th>Trạng Thái</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/api-config.js"></script>

    <script>
        
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const khId = urlParams.get('id');

            if (!khId || khId === 'undefined') {
                console.error("⛔ Lỗi: Không tìm thấy ID khách hàng trên URL!");
                return;
            }

            try {
                const resKH = await fetch(`${API_URL}/api/KhachHang/LayKhachHang/${khId}`);
                if (resKH.ok) {
                    const info = await resKH.json();
                    document.getElementById('historyTitle').innerText = `Lịch Sử Mua Hàng - Khách: ${info.tenKhachHang || info.TenKhachHang}`;
                }
            } catch (e) { console.error("Lỗi nạp tên khách hàng:", e); }

            try {
                const response = await fetch(`${API_URL}/api/KhachHang/LichSuMuaHang/${khId}`);
                const data = await response.json();
                const tableBody = document.getElementById('historyTableBody');
                tableBody.innerHTML = '';

                if (!data || data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Khách hàng này chưa thực hiện đơn hàng nào!</td></tr>`;
                    return;
                }

                data.forEach(dh => {
                    const idDon = dh.donHangId || dh.DonHangId || dh.id || '';
                    const ngayDat = dh.ngayDatHang || dh.NgayDatHang || dh.ngayTao || 'Chưa rõ';
                    const formatNgay = new Date(ngayDat).toLocaleDateString('vi-VN');
                    const tongTien = dh.tongTien || dh.TongTien || 0;
                    const formatTien = new Intl.NumberFormat('vi-VN').format(tongTien) + ' đ';
                    const trangThai = dh.trangThai || dh.TrangThai || dh.trạngThái || 'Đang xử lý';

                    tableBody.innerHTML += `
                            <tr>
                                <td><strong>#DH${idDon}</strong></td>
                                <td>${formatNgay}</td>
                                <td><strong class="text-success">${formatTien}</strong></td>
                                <td><span class="badge bg-label-success">${trangThai}</span></td>
                            </tr>`;
                });
            } catch (error) { console.error("Lỗi nạp lịch sử mua hàng:", error); }
        });
    </script>
</body>
</html>
