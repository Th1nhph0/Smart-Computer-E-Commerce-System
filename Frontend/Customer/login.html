<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng Nhập / Đăng Ký - Smart Computer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      /* CSS riêng cho khu vực Đăng nhập để tránh đụng độ */
      .auth-wrapper {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        padding: 40px 20px;
      }
      .auth-container {
        background: white;
        width: 100%;
        max-width: 450px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        overflow: hidden;
      }
      .auth-tabs {
        display: flex;
        border-bottom: 1px solid #eee;
      }
      .auth-tab {
        flex: 1;
        text-align: center;
        padding: 20px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        color: #888;
        background: #fafafa;
        transition: 0.3s;
      }
      .auth-tab.active {
        color: var(--indigo);
        background: white;
        border-bottom: 3px solid var(--indigo);
      }
      .auth-body {
        padding: 40px 30px;
      }
      .auth-form {
        display: none;
      }
      .auth-form.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
        color: #333;
      }
      .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: inherit;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }
      .form-group input:focus {
        border-color: var(--indigo);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--indigo);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-submit:hover {
        background: #4338ca;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="brand">
          <span class="brand-mark" style="background:var(--indigo)">S</span>
          Smart Computer
        </a>
        <form class="search" role="search" onsubmit="event.preventDefault(); window.location.href='shop.html?search=' + this.querySelector('input').value;">
          <input type="text" placeholder="Tìm kiếm máy tính, linh kiện..." />
          <button type="submit">🔍</button>
        </form>
        <div class="icon-row">
          <a href="login.html" class="icon-btn" id="account-link">👤</a>
          <a href="cart.html" class="icon-btn icon-btn--cart">
            🛒 <span class="count" style="background:red; color:white;">0</span>
          </a>
        </div>
      </div>
    </header>

    <main id="main">
      <div class="auth-wrapper">
        <div class="auth-container">
          <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">ĐĂNG NHẬP</div>
            <div class="auth-tab" onclick="switchTab('register')">ĐĂNG KÝ</div>
          </div>
          
          <div class="auth-body">
            <!-- Form Đăng Nhập -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
              <div class="form-group">
                <label>Tên đăng nhập / Email</label>
                <input type="text" id="login-username" placeholder="Nhập tên đăng nhập..." required />
              </div>
              <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required />
              </div>
              <div style="text-align: right; margin-bottom: 20px;">
                <a href="#" style="color: var(--indigo); font-size: 13px; font-weight: 600;">Quên mật khẩu?</a>
              </div>
              <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
              <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" id="reg-fullname" placeholder="Vd: Nguyễn Văn A" required />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="Nhập email của bạn..." required />
              </div>
              <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu..." required />
              </div>
              <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu..." required />
              </div>
              <button type="submit" class="btn-submit">TẠO TÀI KHOẢN</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 Smart Computer · All rights reserved</span>
        </div>
      </div>
    </footer>

    <script src="assets/js/store.js?v=7" defer></script>
    <script>
      function switchTab(tabId) {
        // Cập nhật tab
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        
        // Cập nhật form
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        document.getElementById(tabId + '-form').classList.add('active');
      }

      function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('login-username').value;
        const pass = document.getElementById('login-password').value;
        
        // Mô phỏng đăng nhập thành công để Demo (Sẽ ghép API C# thật vào đây sau)
        if (user && pass) {
            const fakeUser = {
                id: 1,
                username: user,
                fullName: "Thượng Đế",
                role: "Customer"
            };
            sessionStorage.setItem('loggedInUser', JSON.stringify(fakeUser));
            showToast("Đăng nhập thành công! Đang chuyển hướng...", 'success', 'index.html');
        }
      }

      function handleRegister(e) {
        e.preventDefault();
        const pass = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        
        if (pass !== confirm) {
            showToast("Mật khẩu xác nhận không khớp!", 'error');
            return;
        }
        showToast("Đăng ký thành công! Vui lòng đăng nhập.");
        switchTab('login');
      }
    </script>
  </body>
</html>
